[project]
name = "extremes-paper"
version = "0.1.0"
description = "Station-based per-country verification of AI and NWP forecast models at observed extremes"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "polars>=1.17",
    "pyarrow>=18.0",
    "pyyaml>=6.0",
    "scipy>=1.18.0",
    "pandas>=3.0.3",
    "statsmodels>=0.14.6",
    "matplotlib>=3.11.0",
    "pymupdf>=1.28.0",
    "pillow>=12.3.0",
    "cartopy>=0.25.0",
    "shapely>=2.1.2",
    "clickhouse-connect>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/extremes_paper"]
